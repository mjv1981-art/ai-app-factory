name: Factory checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:factory
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:factory-ui
      - name: Parse optional PowerShell clients
        shell: pwsh
        run: ./scripts/factory-selftest.ps1 -SyntaxOnly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factory-test-evidence
          path: |
            factory-playwright-report/
            factory-test-results/
          retention-days: 7
